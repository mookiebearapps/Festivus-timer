<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Festivus Countdown</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        .background-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vmax;
            height: 200vmax;
            transform: translate(-50%, -50%);
            background: conic-gradient(red, magenta, blue, cyan, lime, yellow, red);
            animation: spin 10s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .countdown-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            z-index: 10;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Pure CSS Festivus Pole */
        #festivus-pole {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px; /* Base width determines bounding box */
            height: 250px;
            z-index: 5;
            will-change: transform;
        }

        .pole-rod {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 240px;
            /* Metallic shine */
            background: linear-gradient(to right, #888 0%, #ddd 40%, #fff 50%, #bbb 70%, #666 100%);
            border: 1px solid #555;
            border-radius: 2px 2px 0 0;
        }

        .pole-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            /* Oval base */
            background: radial-gradient(ellipse at center, #aaa 0%, #555 100%);
            border: 1px solid #333;
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    
    <!-- CSS-based pole instead of image -->
    <div id="festivus-pole">
        <div class="pole-rod"></div>
        <div class="pole-base"></div>
    </div>

    <div class="countdown-container" id="countdown">
        Loading...
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            let year = now.getFullYear();
            let festivusDate = new Date(year, 11, 23);

            if (now.getTime() > festivusDate.getTime()) {
                festivusDate = new Date(year + 1, 11, 23);
            }

            const diff = festivusDate.getTime() - now.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerText = 
                `${days}days ${hours.toString().padStart(2, '0')}hrs ${mins.toString().padStart(2, '0')}min ${secs.toString().padStart(2, '0')}sec`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        const pole = document.getElementById('festivus-pole');
        let x = 50;
        let y = 50;
        let dx = 3;
        let dy = 3;

        function animatePole() {
            const maxX = window.innerWidth - pole.clientWidth;
            const maxY = window.innerHeight - pole.clientHeight;

            x += dx;
            y += dy;

            if (x <= 0) { x = 0; dx = Math.abs(dx); }
            else if (x >= maxX) { x = maxX; dx = -Math.abs(dx); }

            if (y <= 0) { y = 0; dy = Math.abs(dy); }
            else if (y >= maxY) { y = maxY; dy = -Math.abs(dy); }

            pole.style.transform = `translate(${x}px, ${y}px)`;
            requestAnimationFrame(animatePole);
        }

        requestAnimationFrame(animatePole);
    </script>
</body>
</html>
